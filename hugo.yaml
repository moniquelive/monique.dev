baseURL: https://monique.dev/
title: monique.dev
theme: lirio
defaultContentLanguage: pt-br
locale: pt-BR
timeZone: America/Sao_Paulo
summaryLength: 10

pagination:
  pagerSize: 20

enableRobotsTXT: true
enableEmoji: true
enableGitInfo: true

taxonomies:
  tag: tags

sitemap:
  changefreq: weekly
  priority: 0.5
  filename: sitemap.xml

markup:
  highlight:
    noClasses: false
    guessSyntax: true
    tabWidth: 2
    lineNos: false
  goldmark:
    renderer:
      unsafe: true

params:
  author: Monique Oliveira
  title: monique.dev
  description: Artigos sobre desenvolvimento, ferramentas e tecnologia.
  defaultImage: /social-card.png
  defaultImageWidth: 1200
  defaultImageHeight: 630
  mainSections: [posts]
  singleDateFormat: "2/1/2006"
  indexDateFormat: "2/1/2006"
  listDateFormat: "2/1/2006"
  showTOC: true
  showDates: true
  showEstimatedReadingTime: true

outputs:
  home:
    - HTML
    - RSS
  page:
    - HTML
  section:
    - HTML
    - RSS
  term:
    - HTML
    - RSS
  taxonomy:
    - HTML
