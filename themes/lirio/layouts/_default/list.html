{{ define "main" }}
  {{ $p := .Paginator }}
  <section aria-label="Lista de posts">
    <h1>{{ .Title }}</h1>
    <div class="post-grid">
      {{ range $p.Pages }}
        {{ partial "post-card.html" (dict
          "page" .
          "headingLevel" 2
          "dateFormat" (.Site.Params.listDateFormat | default ":date_medium")
        ) }}
      {{ end }}
    </div>
    {{ partial "pagination.html" (dict "p" $p) }}
  </section>
{{ end }}
