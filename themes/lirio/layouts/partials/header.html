<header class="site-header">
  <div class="container-fluid">
    <nav aria-label="Navegação principal">
      <ul>
        <li>
          <a class="brand" href="{{ site.Home.RelPermalink }}">
            <img alt="" src="{{ "favicon.svg" | relURL }}" aria-hidden="true" />
            <span>{{ .Site.Title }}</span>
          </a>
        </li>
      </ul>
      <ul class="nav-links">
        <li><a href="{{ "posts/" | relURL }}"{{ if eq .Section "posts" }} aria-current="page"{{ end }}>Posts</a></li>
        <li><a href="{{ "tags/" | relURL }}"{{ if eq .Type "tags" }} aria-current="page"{{ end }}>Tags</a></li>
        <li><a href="{{ "about/" | relURL }}"{{ if eq .Type "about" }} aria-current="page"{{ end }}>Sobre</a></li>
        <li><a href="{{ "index.xml" | relURL }}">RSS</a></li>
      </ul>
    </nav>
  </div>
</header>
